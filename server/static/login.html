<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ebe6">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
<title>Zaloguj się · Szachy</title>
</head>
<body>
<main>
  <div class="auth">
    <div class="brand-big"><span id="logo"></span><h1>Szachy</h1><div class="muted">Graj z przyjaciółmi w przeglądarce</div></div>
    <div class="segmented" id="tabs">
      <button type="button" data-mode="login" class="selected">Logowanie</button>
      <button type="button" data-mode="register">Rejestracja</button>
    </div>
    <form id="auth-form" novalidate>
      <div class="field">
        <label for="username">Nazwa użytkownika</label>
        <input id="username" name="username" autocomplete="username" required maxlength="20">
      </div>
      <div class="field">
        <label for="password">Hasło</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="field" id="password2-field" hidden>
        <label for="password2">Powtórz hasło</label>
        <input id="password2" name="password2" type="password" autocomplete="new-password">
      </div>
      <button class="primary block" type="submit" id="submit" style="margin-top:8px">Zaloguj się</button>
      <div class="error-text" id="error"></div>
    </form>
    <div class="guest-alt">albo <button class="link accent" id="guest">graj jako gość</button></div>
  </div>
</main>
<script type="module" src="/static/js/login.js"></script>
</body>
</html>
