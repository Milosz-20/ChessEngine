<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ebe6">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
<title>Graj · Szachy</title>
</head>
<body>
<main>
  <div class="lobby">
    <div>
      <div class="eyebrow">Nowa partia</div>
      <h1 class="title">Zagraj z przyjacielem</h1>
      <div class="tc-grid" id="tc-grid"></div>
      <div class="label-small">Grasz jako</div>
      <div class="segmented" id="color-pick">
        <button type="button" data-color="white"><span class="dot-color white"></span>Białe</button>
        <button type="button" data-color="random" class="selected"><span class="dot-color random"></span>Losowo</button>
        <button type="button" data-color="black"><span class="dot-color black"></span>Czarne</button>
      </div>
      <button class="primary block" id="create">Utwórz partię</button>
      <div class="error-text" id="create-error"></div>
      <div class="hint">Dostaniesz link do wysłania znajomemu. Partia pojawi się też na liście otwartych gier.</div>
    </div>
    <div>
      <div class="section" id="active-section" hidden>
        <div class="list-head">Twoje trwające partie</div>
        <div id="active-games"></div>
      </div>
      <div class="section">
        <div class="list-head">Otwarte partie</div>
        <div id="open-games"></div>
      </div>
    </div>
  </div>
</main>
<script type="module" src="/static/js/lobby.js"></script>
</body>
</html>
