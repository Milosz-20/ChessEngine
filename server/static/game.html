<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ebe6">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
<title>Partia · Szachy</title>
</head>
<body>
<main>
  <div class="game">
    <div class="board-wrap"><div id="board"></div></div>
    <div class="player" id="top-player"><div class="nm"></div><div class="clock"></div></div>
    <div id="panel"></div>
    <div id="moves-box"><div class="moves-grid" id="moves"></div></div>
    <div class="nav-buttons">
      <button id="nav-first" aria-label="Początek partii"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v10M12 3 7 8l5 5"/></svg></button>
      <button id="nav-prev" aria-label="Poprzedni ruch"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
      <button id="nav-next" aria-label="Następny ruch"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></button>
      <button id="nav-last" aria-label="Aktualna pozycja"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10M4 3l5 5-5 5"/></svg></button>
    </div>
    <div id="controls"></div>
    <div class="player" id="bottom-player"><div class="nm"></div><div class="clock"></div></div>
    <div class="conn-status" id="conn-status"></div>
  </div>
</main>
<script type="module" src="/static/js/game.js"></script>
</body>
</html>
